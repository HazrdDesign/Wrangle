name: Release

# Creates a GitHub Release with the signed ZXP attached.
#
# To cut a release: run sign.bat, commit the fresh Builds/Wrangle.zxp,
# update .github/RELEASE_NOTES.md, then push a version tag:
#
#     git tag v1.2.0 && git push origin v1.2.0
#
# The release is created automatically from that tag's commit. You can also
# run it manually from the Actions tab. Notes come from RELEASE_NOTES.md
# (auto-generated from commits if that file is missing).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release with signed ZXP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          test -f "Builds/Wrangle.zxp" || { echo "Builds/Wrangle.zxp not found"; exit 1; }
          cp "Builds/Wrangle.zxp" "Wrangle-${TAG}.zxp"

          if [ -f .github/RELEASE_NOTES.md ]; then
            NOTES=(--notes-file .github/RELEASE_NOTES.md)
          else
            NOTES=(--generate-notes)
          fi

          gh release create "$TAG" "Wrangle-${TAG}.zxp" \
            --target "${{ github.sha }}" \
            --title "Wrangle $TAG" \
            "${NOTES[@]}"
