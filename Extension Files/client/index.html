<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <!-- Header -->

                        <path
                            d="M146.64,70.32c-.32,26.17-6.53,63.72-37.07,65.8,11.95-17.22,10.95-50.2-13.03-56.13-42.93-5.77-42.99,44.3-12,62.24C24.64,171.45-17.82,77.35,63.88,20.04L46.11,0c-95.05,74.66-25.9,202.27,52.38,148.69,43.28,12.22,65.25-37.98,74.27-71.67l-26.12-6.7ZM76.43,113.05c-5.38-14.04,8.42-26.65,21.43-18.63,10.32,9.61,6.63,28.47-2.09,38.3-8.46-4.02-15.89-11.3-19.34-19.67Z" />
                    </g>
                </svg>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="handleAddButton(event)" title="Add Expression">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                    </svg>
                </button>
                <button class="icon-btn" onclick="handleAddCategoryButton(event)" title="Add Category">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" />
                    </svg>
                </button>
                <button class="icon-btn" onclick="removeAllExpressions()" id="btn-remove-all"
                    title="Remove All Expressions">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z" />
                    </svg>
                </button>
                <button class="icon-btn" onclick="openSettings()" title="Settings">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                    </svg>
                </button>
                <button class="icon-btn" onclick="showHelp()" title="Help">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6C7.88 12.15 7 10.63 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.88 3.15-2.15 4.1z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="main-body">

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="nav-group" id="sidebar-nav">
                    <!-- Categories populated by JS -->
                </div>
            </div>

            <!-- Content -->
            <div class="content-area">
                <div class="content-header" id="content-header">
                    <span id="cat-title">MOTION LIBRARY</span>
                    <span id="item-count" class="count-badge">6 ITEMS</span>
                </div>
                <div class="expression-list" id="content">
                    <!-- Expressions populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Dialog -->
    <div class="dialog-overlay" id="dialog">
        <div class="dialog">
            <div class="dialog-header">
                <div class="dialog-title">Add Expression</div>
                <button class="close-btn" onclick="closeDialog()">✕</button>
            </div>

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="inp-name" class="form-control" placeholder="Expression Name">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="inp-cat" class="form-control">
                    <!-- Categories populated by JS -->
                </select>
            </div>

            <div class="form-group">
                <label>Color</label>
                <input type="color" id="inp-color" class="form-control" value="#2997ff">
            </div>

            <div class="form-group">
                <label>Controllers <span id="ctrl-status"
                        style="margin-left: 5px; font-weight: bold; color: #6e7681;">None</span></label>
            </div>

            <div class="form-group">
                <label>Expression</label>
                <textarea id="inp-code" class="form-control" placeholder="wiggle(5, 50);"></textarea>
            </div>

            <div class="dialog-footer">
                <button class="btn btn-save" onclick="saveExpression()">Save</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="dialog-overlay" id="settings-modal">
        <div class="dialog">
            <div class="dialog-header">
                <div class="dialog-title">Settings</div>
                <button class="close-btn" onclick="closeSettings()">✕</button>
            </div>

            <div class="form-group">
                <label>Panel Hue</label>
                <div class="slider-container">
                    <input type="range" id="set-hue" min="0" max="360" value="220">
                    <span class="slider-val" id="val-hue">220</span>
                </div>
            </div>

            <div class="form-group">
                <label>Font Size</label>
                <div class="slider-container">
                    <input type="range" id="set-font" min="10" max="18" value="13">
                    <span class="slider-val" id="val-font">13px</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Help Modal -->
    <div class="dialog-overlay" id="help-modal">
        <div class="dialog">
            <div class="dialog-header">
                <div class="dialog-title">Click Instructions</div>
                <button class="close-btn" onclick="closeHelp()">✕</button>
            </div>

            <div class="help-content">
                <div class="help-item">
                    <div class="help-label">Click</div>
                    <div class="help-desc">Apply expression + controllers</div>
                </div>
                <div class="help-item">
                    <div class="help-label">Ctrl + Click</div>
                    <div class="help-desc">Apply expression only (no controllers)</div>
                </div>
                <div class="help-item">
                    <div class="help-label">Alt + Click</div>
                    <div class="help-desc">Apply controllers only (no expression)</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Edit Modal -->
    <div class="dialog-overlay" id="category-modal">
        <div class="dialog">
            <div class="dialog-header">
                <div class="dialog-title">Edit Category</div>
                <button class="close-btn" onclick="closeCategoryDialog()">✕</button>
            </div>
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" id="inp-cat-name" class="form-control" placeholder="Category Name">
            </div>
            <div class="form-group">
                <label>Icon (Emoji or SVG)</label>
                <input type="text" id="inp-cat-icon" class="form-control" placeholder="e.g. 📁">
            </div>
            <div class="dialog-footer">
                <button class="btn btn-save" onclick="saveCategoryName()">Save</button>
                <button class="btn btn-delete" id="btn-del-cat" onclick="deleteCategoryBtn()">Delete Category</button>
            </div>
        </div>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/library.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
